<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>もちもちスタジオ | ローカル編集</title><link rel="icon" href="../assets/images/whale.svg"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="editor.css"><script defer src="../assets/js/layout.js"></script><script defer src="editor.js"></script></head>
<body><header class="editor-header"><div class="editor-brand"><img src="../assets/images/whale.svg" width="38" height="25" alt=""><strong>もちもちスタジオ</strong><span>LOCAL EDITOR</span></div><div class="header-actions"><button id="undo" title="Ctrl+Z">↶ 戻す</button><button id="redo" title="Ctrl+Shift+Z">↷ やり直す</button><button id="import">JSONを開く</button><button id="export" class="primary">JSONを書き出す ↓</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></header>
<div class="editor-workspace"><aside class="left-panel"><h2>ページ</h2><select id="pages" aria-label="編集中のページ"></select><div class="button-row"><button id="add-page">＋ 追加</button><button id="delete-page">削除</button></div><label>ページ名<input id="page-title" maxlength="200"></label><label>ページの説明<textarea id="page-description" rows="2"></textarea></label><h2>パーツを追加</h2><div class="add-grid"><button data-add="heading">H 見出し</button><button data-add="text">T テキスト</button><button id="add-image">▧ 画像</button><button data-add="link">↗ リンク</button><button id="add-menu">☰ メニュー</button><button data-add="panel">□ 装飾</button></div><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
<h2>ページデザイン</h2><label>テーマ<select id="theme"><option value="starry">星空 / ネイビー</option><option value="paper">紙とインク / クリーム</option><option value="garden">ガーデン / セージ</option><option value="pop">ポップ / ラベンダー</option></select></label><label>背景色<input id="page-background" type="color" value="#0b142c"></label><div class="button-row"><button id="background-image">背景画像</button><button id="clear-background">解除</button></div><input id="background-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><label>ページの高さ（px）<input id="page-height" type="number" min="200" max="30000" step="10"></label><button id="reset-page" class="wide">標準デザインに戻す</button><h2>レイヤー</h2><div id="layers" class="layers" aria-label="要素の一覧"></div></aside>
<section class="canvas-area" aria-label="ビジュアル編集キャンバス"><div class="canvas-toolbar"><div class="segmented" role="group" aria-label="表示サイズ"><button id="desktop" aria-pressed="true">▰ PC</button><button id="mobile" aria-pressed="false">▯ スマホ</button></div><label class="check"><input id="snap" type="checkbox" checked> グリッド吸着</label><button id="preview" aria-pressed="false">▶ 閲覧プレビュー</button><span id="zoom"></span></div><p class="canvas-hint" id="hint">クリックで選択、ドラッグで移動。右下のハンドルでサイズ変更。PCとスマホの配置は個別に保存します。</p><div class="canvas-scroll" id="canvas-scroll"><div id="canvas-wrap"><div id="canvas" class="layout-stage"></div><div id="selection" hidden><span id="selection-name"></span><button id="resize-handle" aria-label="ドラッグしてサイズ変更" title="サイズ変更"></button></div></div></div><div id="status" role="status" aria-live="polite">エディターを起動しています…</div></section>
<aside class="right-panel"><h2>パーツの設定</h2><p id="no-selection" class="muted">画面上のパーツをクリックすると編集できます。</p><div id="inspector" hidden><label>名前<input id="element-name" maxlength="120"></label><label class="for-copy">文字<textarea id="element-text" rows="4"></textarea></label><label class="for-link">リンク先<input id="element-href" placeholder="https://… または profile.html"></label><label class="for-image">画像の説明（代替テキスト）<input id="element-alt"></label><label class="check for-image"><input id="element-pixel" type="checkbox"> ドットをくっきり表示</label><label class="for-image">画像の表示<select id="element-fit"><option value="contain">全体を収める</option><option value="cover">枠いっぱいに表示</option></select></label><button id="replace-image" class="for-image wide">画像を差し替え</button><input id="replace-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<div class="field-grid"><label>X<input id="element-x" type="number" min="-5000" max="30000"></label><label>Y<input id="element-y" type="number" min="-5000" max="30000"></label><label>幅<input id="element-w" type="number" min="1" max="10000"></label><label>高さ<input id="element-h" type="number" min="1" max="30000"></label></div><label class="check"><input id="element-hidden" type="checkbox"> この表示サイズで非表示</label><div class="for-copy"><label>フォント<select id="element-font"><option value="sans">ゴシック</option><option value="serif">明朝</option><option value="mono">等幅</option><option value="rounded">ラウンド</option></select></label><div class="field-grid"><label>文字サイズ<input id="element-fontSize" type="number" min="8" max="300"></label><label>文字色<input id="element-color" type="color"></label></div><label class="check"><input id="element-bold" type="checkbox"> 太字</label><label>文字揃え<select id="element-align"><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select></label></div><div class="field-grid"><label>背景色<input id="element-background" type="color"></label><label>角丸<input id="element-radius" type="number" min="0" max="1000"></label><label>枠線色<input id="element-borderColor" type="color"></label><label>枠線幅<input id="element-borderWidth" type="number" min="0" max="30"></label></div><button id="transparent" class="wide">背景を透明にする</button><label>重なり順<input id="element-z" type="number" min="-1000" max="10000"></label><div class="button-row"><button id="backward">↓ 背面</button><button id="forward">↑ 前面</button></div><div class="button-row"><button id="duplicate">複製</button><button id="delete" class="danger">削除</button></div></div><div class="editor-note">編集画面はこのPC上だけで使用します。書き出したJSONを <code>data/layout.json</code> に保存してGitHubへ反映すると、公開表示が更新されます。画像もJSONに含まれます。</div></aside></div>
<dialog id="page-dialog"><form method="dialog"><h2>新しいページ</h2><label>ページ名<input id="new-page-title" required maxlength="100" value="新しいページ"></label><p class="muted">ページのURLは自動で作成します。</p><div class="button-row"><button value="cancel" formnovalidate>キャンセル</button><button id="confirm-page" value="create" class="primary">作成</button></div></form></dialog>
<iframe id="baseline-frame" title="標準レイアウトの取り込み" tabindex="-1" aria-hidden="true"></iframe></body></html>
